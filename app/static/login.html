<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HVAC DiagTree — log in</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./icon-512.png" sizes="512x512">
<link rel="stylesheet" href="./style.css">
<style>
.landing { max-width: 480px; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
.landing h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
.landing p { line-height: 1.55; color: var(--muted); }
.lang-switch { display: flex; gap: .4rem; justify-content: flex-end; margin-bottom: 1.5rem; }
.lang-switch button {
  background: transparent; color: var(--muted); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: .35rem .7rem; cursor: pointer; font: inherit;
}
.lang-switch button.active { color: var(--accent); border-color: var(--accent); }
[data-lang-block] { display: none; }
[data-lang-block].shown { display: block; }
form { margin-top: 1.5rem; }
input[type="email"] {
  width: 100%; box-sizing: border-box; background: var(--panel); color: var(--text);
  border: 1px solid var(--panel-border); border-radius: 10px; padding: .9rem 1rem;
  font-size: 1rem; margin-bottom: .9rem;
}
button.submit {
  width: 100%; background: var(--accent); color: #06121d; font-weight: 700;
  border: none; border-radius: 12px; padding: 1rem; font-size: 1.05rem; cursor: pointer;
}
button.submit:disabled { opacity: .6; cursor: default; }
.result { margin-top: 1.2rem; font-size: .9rem; }
.result.ok { color: #4fd18b; }
.result.err { color: #ff7a7f; }
.result.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="landing">
  <div class="lang-switch">
    <button type="button" data-set-lang="en">EN</button>
    <button type="button" data-set-lang="ru">RU</button>
  </div>

  <section data-lang-block="en">
    <h1>Log in to HVAC DiagTree</h1>
    <p>Enter the email you registered with — we'll send a fresh one-time login link.</p>
    <form id="form-en">
      <input type="email" name="email" placeholder="you@example.com" required>
      <button type="submit" class="submit">Send login link</button>
    </form>
    <div class="result" id="result-en"></div>
  </section>

  <section data-lang-block="ru">
    <h1>Вход в HVAC DiagTree</h1>
    <p>Введите email, которым регистрировались — пришлём новую одноразовую ссылку.</p>
    <form id="form-ru">
      <input type="email" name="email" placeholder="you@example.com" required>
      <button type="submit" class="submit">Отправить ссылку</button>
    </form>
    <div class="result" id="result-ru"></div>
  </section>
</div>
<script src="./landing.js"></script>
<script src="./login.js"></script>
</body>
</html>
