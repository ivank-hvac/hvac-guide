<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HVAC DiagTree — confirm sign-in</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./icon-512.png" sizes="512x512">
<link rel="stylesheet" href="./style.css">
<style>
.landing { max-width: 480px; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
.landing h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
.landing p { line-height: 1.55; color: var(--muted); }
.lang-switch { display: flex; gap: .4rem; justify-content: flex-end; margin-bottom: 1.5rem; }
.lang-switch button {
  background: transparent; color: var(--muted); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: .35rem .7rem; cursor: pointer; font: inherit;
}
.lang-switch button.active { color: var(--accent); border-color: var(--accent); }
[data-lang-block] { display: none; }
[data-lang-block].shown { display: block; }
button.submit {
  width: 100%; background: var(--accent); color: #06121d; font-weight: 700;
  border: none; border-radius: 12px; padding: 1rem; font-size: 1.05rem; cursor: pointer;
  margin-top: 1.5rem;
}
button.submit:disabled { opacity: .6; cursor: default; }
.result { margin-top: 1.2rem; font-size: .9rem; }
.result.ok { color: #4fd18b; }
.result.err { color: #ff7a7f; }
.alert-box {
  border-radius: 10px; padding: .9rem 1rem; margin-bottom: 1rem;
  font-weight: 600; line-height: 1.5;
}
.alert-box.severe { background: #3a1616; color: #ffd6d6; border: 1px solid #ff5d5d; }
.alert-box.mild { background: #241c0d; color: #e7e9ee; border: 1px solid #f0b429; }
</style>
</head>
<body>
<div class="landing">
  <div class="lang-switch">
    <button type="button" data-set-lang="en">EN</button>
    <button type="button" data-set-lang="ru">RU</button>
  </div>

  <section data-lang-block="en">
    <h1>Confirm before continuing</h1>
    <div class="alert-box" id="alert-en"></div>
    <p>This is going to sign you in as <strong id="email-en">…</strong>. If that's not your own email, close this page now — do not continue.</p>
    <button type="button" class="submit" id="continue-en">Continue as this account</button>
    <div class="result" id="result-en"></div>
  </section>

  <section data-lang-block="ru">
    <h1>Подтвердите перед продолжением</h1>
    <div class="alert-box" id="alert-ru"></div>
    <p>Вы собираетесь войти как <strong id="email-ru">…</strong>. Если это не ваш email — закройте страницу, не продолжайте.</p>
    <button type="button" class="submit" id="continue-ru">Продолжить под этим аккаунтом</button>
    <div class="result" id="result-ru"></div>
  </section>
</div>
<script src="./landing.js"></script>
<script src="./session-conflict.js"></script>
</body>
</html>
