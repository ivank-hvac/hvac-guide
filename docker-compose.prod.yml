services:
  hvac-guide:
    build: .
    container_name: hvac-guide
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - AI_ASSIST_RATE_LIMIT=${AI_ASSIST_RATE_LIMIT:-8/minute}
      - LOG_SESSION_RATE_LIMIT=${LOG_SESSION_RATE_LIMIT:-30/minute}
    volumes:
      - hvac_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: hvac-guide-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CADDY_BASIC_AUTH_USER=${CADDY_BASIC_AUTH_USER:-}
      - CADDY_BASIC_AUTH_HASH=${CADDY_BASIC_AUTH_HASH:-}
    depends_on:
      - hvac-guide
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  hvac_data:
