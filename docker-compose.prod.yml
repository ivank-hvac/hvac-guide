services:
  hvac-guide:
    # The image runs as the unprivileged user `hvac` (uid 10001), set with
    # USER in the Dockerfile — not root. Nothing here needs privileges: the
    # app binds 8000 and writes only to the mounted data volume. Upgrading a
    # deployment created before this change needs a one-time chown of the
    # existing volume — see DEPLOY.md.
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-unknown}
    container_name: hvac-guide
    # Bounded on purpose: the log is a ring, not an archive. Two rotated
    # files of 10 MB each cap what any traffic spike — a scan, a flood — can
    # write to disk, while still holding plenty for local debugging. The
    # durable copy lives on the collector, shipped by rsyslog on the host,
    # which is deliberately NOT wired into the container's start: a logging
    # driver that dials the network makes the container fail to start when
    # the network is not up yet, which is how a reboot took the site down.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - AI_ASSIST_RATE_LIMIT=${AI_ASSIST_RATE_LIMIT:-8/minute}
      - AI_ASSIST_MAX_TOKENS=${AI_ASSIST_MAX_TOKENS:-2048}
      - AI_DEEP_DIVE_MAX_TOKENS=${AI_DEEP_DIVE_MAX_TOKENS:-3000}
      - AI_DAILY_LIMIT_PER_SESSION=${AI_DAILY_LIMIT_PER_SESSION:-100}
      - AI_DAILY_LIMIT_GLOBAL=${AI_DAILY_LIMIT_GLOBAL:-400}
      - LOG_SESSION_RATE_LIMIT=${LOG_SESSION_RATE_LIMIT:-30/minute}
      - SESSION_RATE_LIMIT=${SESSION_RATE_LIMIT:-20/minute}
      - MONITOR_PANEL_TOKEN=${MONITOR_PANEL_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - LOGIN_TOKEN_TTL_MINUTES=${LOGIN_TOKEN_TTL_MINUTES:-15}
      - LOGIN_SESSION_TTL_DAYS=${LOGIN_SESSION_TTL_DAYS:-30}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5/minute}
      - INVITE_DAILY_LIMIT_PER_USER=${INVITE_DAILY_LIMIT_PER_USER:-20}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - hvac_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: hvac-guide-caddy
    # Bounded on purpose: the log is a ring, not an archive. Two rotated
    # files of 10 MB each cap what any traffic spike — a scan, a flood — can
    # write to disk, while still holding plenty for local debugging. The
    # durable copy lives on the collector, shipped by rsyslog on the host,
    # which is deliberately NOT wired into the container's start: a logging
    # driver that dials the network makes the container fail to start when
    # the network is not up yet, which is how a reboot took the site down.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    ports:
      - "80:80"
      - "443:443"
    # Overridden on dev — see docker-compose.dev-prod-mirror.yml.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_BASIC_AUTH_USER=${CADDY_BASIC_AUTH_USER:-}
      - CADDY_BASIC_AUTH_HASH=${CADDY_BASIC_AUTH_HASH:-}
      - CADDY_UPSTREAM=${CADDY_UPSTREAM:-hvac-guide:8000}
    depends_on:
      - hvac-guide
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  hvac_data:
