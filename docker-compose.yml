services:
  hvac-guide:
    build: .
    container_name: hvac-guide
    ports:
      - "8080:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - LOG_SESSION_RATE_LIMIT=${LOG_SESSION_RATE_LIMIT:-30/minute}
    volumes:
      - hvac_data:/app/data
    restart: unless-stopped

volumes:
  hvac_data:
