services:
  hvac-guide:
    # The image runs as the unprivileged user `hvac` (uid 10001), set with
    # USER in the Dockerfile — not root. Nothing here needs privileges: the
    # app binds 8000 and writes only to the mounted data volume. Upgrading a
    # deployment created before this change needs a one-time chown of the
    # existing volume — see DEPLOY.md.
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-unknown}
    container_name: hvac-guide
    ports:
      - "8080:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - AI_ASSIST_RATE_LIMIT=${AI_ASSIST_RATE_LIMIT:-8/minute}
      - AI_ASSIST_MAX_TOKENS=${AI_ASSIST_MAX_TOKENS:-2048}
      - AI_DEEP_DIVE_MAX_TOKENS=${AI_DEEP_DIVE_MAX_TOKENS:-3000}
      - AI_DAILY_LIMIT_PER_SESSION=${AI_DAILY_LIMIT_PER_SESSION:-100}
      - AI_DAILY_LIMIT_GLOBAL=${AI_DAILY_LIMIT_GLOBAL:-400}
      - LOG_SESSION_RATE_LIMIT=${LOG_SESSION_RATE_LIMIT:-30/minute}
      - SESSION_RATE_LIMIT=${SESSION_RATE_LIMIT:-20/minute}
      - MONITOR_PANEL_TOKEN=${MONITOR_PANEL_TOKEN:-}
    volumes:
      - hvac_data:/app/data
    restart: unless-stopped

volumes:
  hvac_data:
